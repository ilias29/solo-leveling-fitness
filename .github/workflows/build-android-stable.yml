name: Build Stable Signed Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Android signing secrets are missing."
            exit 1
          fi

      - name: Install Capacitor
        run: npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Restore permanent signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/solo-leveling-release.jks
          test -s android/app/solo-leveling-release.jks

      - name: Configure release signing and version
        run: |
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"2.0.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("solo-leveling-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Solo-Leveling-Fitness.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Solo-Leveling-Fitness-Stable-APK
          path: Solo-Leveling-Fitness.apk
          if-no-files-found: error

      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="stable-${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Solo-Leveling-Fitness.apk --clobber
          else
            gh release create "$TAG" Solo-Leveling-Fitness.apk \
              --title "Solo Leveling Fitness stable ${GITHUB_RUN_NUMBER}" \
              --notes "Stable signed Android release. Future stable builds can update this app without uninstalling." \
              --latest
          fi
