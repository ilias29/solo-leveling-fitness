name: Build Stable Signed Android APK

# Every APK from this workflow is signed with the same permanent release key (GitHub Secrets),
# keeps applicationId com.ilias.sololevelingfitness and gets a strictly increasing versionCode,
# so it installs as an UPDATE over the previous stable APK and keeps the user's data.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_ID: com.ilias.sololevelingfitness
      APK: Solo-Leveling-Fitness.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_B64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$STORE_PASS" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASS" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing Android signing secrets:$missing. Add them in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install dependencies (pinned)
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web app
        run: npm run build:www

      - name: Version
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION_NAME"
            exit 1
          fi
          # Minutes since 1970: always increases, independent of workflow run numbers.
          VERSION_CODE=$(( $(date +%s) / 60 ))
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "versionName $VERSION_NAME, versionCode $VERSION_CODE"

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Restore permanent signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/solo-leveling-release.jks
          test -s android/app/solo-leveling-release.jks

      - name: Configure release signing and version
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              defaultConfig {
                  applicationId System.getenv("APP_ID")
                  versionCode Integer.parseInt(System.getenv("VERSION_CODE"))
                  versionName System.getenv("VERSION_NAME")
              }
              signingConfigs {
                  release {
                      storeFile file("solo-leveling-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../$APK"

      - name: Remove keystore from runner
        if: always()
        run: rm -f android/app/solo-leveling-release.jks

      - name: Verify APK (package, version, signature)
        env:
          EXPECTED_CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          BADGING=$("$BT/aapt2" dump badging "$APK" | head -1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='$APP_ID'" || { echo "::error::Wrong applicationId"; exit 1; }
          echo "$BADGING" | grep -q "versionCode='$VERSION_CODE'" || { echo "::error::Wrong versionCode"; exit 1; }
          echo "$BADGING" | grep -q "versionName='$VERSION_NAME'" || { echo "::error::Wrong versionName"; exit 1; }
          CERTS=$("$BT/apksigner" verify --print-certs "$APK")
          echo "$CERTS"
          echo "$CERTS" | grep -qi "CN=Android Debug" && { echo "::error::APK is signed with a debug key"; exit 1; }
          SHA=$(echo "$CERTS" | grep -m1 "certificate SHA-256 digest" | awk '{print $NF}')
          echo "CERT_SHA256=$SHA" >> "$GITHUB_ENV"
          norm() { echo "$1" | tr -d ':' | tr 'A-F' 'a-f'; }
          if [ -n "$EXPECTED_CERT" ] && [ "$(norm "$SHA")" != "$(norm "$EXPECTED_CERT")" ]; then
            echo "::error::Signing certificate changed! Expected $EXPECTED_CERT, got $SHA. Updates would fail."
            exit 1
          fi
          {
            echo "### Solo Leveling Fitness $VERSION_NAME"
            echo "- applicationId: \`$APP_ID\`"
            echo "- versionCode: \`$VERSION_CODE\`"
            echo "- signing certificate SHA-256: \`$SHA\`"
            if [ -z "$EXPECTED_CERT" ]; then
              echo "- Tip: save this SHA-256 as repository variable \`ANDROID_CERT_SHA256\` to block any future key change."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Solo-Leveling-Fitness-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$VERSION_NAME-$VERSION_CODE"; fi
          NOTES="Stable signed Android release $VERSION_NAME (versionCode $VERSION_CODE).
          Installs as an update over previous stable releases without losing data.
          Signing certificate SHA-256: $CERT_SHA256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
              --title "Solo Leveling Fitness $VERSION_NAME ($VERSION_CODE)" \
              --notes "$NOTES" --latest
          fi
