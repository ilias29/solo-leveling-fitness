name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "www/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Capacitor
        run: npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Solo-Leveling-Fitness.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Solo-Leveling-Fitness-APK
          path: Solo-Leveling-Fitness.apk
          if-no-files-found: error

      - name: Publish downloadable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Solo-Leveling-Fitness.apk --clobber
          else
            gh release create "$TAG" Solo-Leveling-Fitness.apk \
              --title "Solo Leveling Fitness build ${GITHUB_RUN_NUMBER}" \
              --notes "Android APK with muscle maps and editable repetitions." \
              --latest
          fi
