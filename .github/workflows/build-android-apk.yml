name: Build Android APK (debug, test only)

# Debug APKs are signed with a temporary key that changes on every run, so they can never
# update an installed app. They are kept only as workflow artifacts for testing and are not
# published as releases. Use "Build Stable Signed Android APK" for installable updates.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies (pinned)
        run: npm ci

      - name: Build web app
        run: npm run build:www

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Solo-Leveling-Fitness-debug.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Solo-Leveling-Fitness-debug-APK
          path: Solo-Leveling-Fitness-debug.apk
          if-no-files-found: error
