name: CI

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: www/ is in sync with the web app
        run: |
          npm run build:www
          git add -A www
          git diff --cached --exit-code --stat www || (echo "::error::www/ is out of date. Run npm run build:www and commit." && exit 1)

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e
